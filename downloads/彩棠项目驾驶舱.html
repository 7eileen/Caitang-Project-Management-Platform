const md=d=>d?d.slice(5).replace('-','.'):'未填';const stamp=d=>new Date(d+'T00:00:00Z').getTime();
// Beijing uses UTC+8. Keep the live calendar separate from the uploaded snapshot.
const BEIJING_OFFSET = 8 * 60 * 60 * 1000;
function beijingToday() { return new Date(Date.now() + BEIJING_OFFSET).toISOString().slice(0, 10); }
let currentDay = beijingToday(), dayTimer;
function scheduleDayRefresh() {
  clearTimeout(dayTimer);
  const nextMidnight = stamp(currentDay) + 86400000 - BEIJING_OFFSET;
  dayTimer = setTimeout(refreshCurrentDay, Math.max(50, nextMidnight - Date.now() + 50));
}
function refreshCurrentDay() {
  const nextDay = beijingToday();
  if (nextDay !== currentDay) {
    currentDay = nextDay;
    if (view === 'overview') render();
  }
  scheduleDayRefresh();
}

function status(v){v=String(v||'').trim();if(/延期|逾期/.test(v))return '已延期';if(/已完成/.test(v))return '已完成';if(/进行中|评审中/.test(v))return '进行中';if(/待启动|未开始/.test(v))return '待启动';return '待确认'}
function cls(s){return s==='已完成'?'done':s==='进行中'?'active':s==='已延期'?'late':'pending'}const badge=s=>`<span class="badge ${cls(s)}">${esc(s)}</span>`;
function parseModel(src){const ps=src.sheets.find(s=>s.sheet==='项目计划');let plans=[],group='阶段任务';if(ps)ps.data.slice(3).forEach((r,ii)=>{if(!r[0])return;const name=String(r[0]).trim(),duration=String(r[1]||''),match=duration.match(/（(\d{1,2})\.(\d{1,2})-(\d{1,2})\.(\d{1,2})）/);if(/^需求评审彩棠|^实施开发开发计划|^功能测试$/.test(name))group=/需求评审/.test(name)?'需求评审':/实施开发/.test(name)?'实施开发':'功能测试';const stage=ii===0?1:ii===1?2:ii<=4?3:4;plans.push({id:'plan-'+(ii+4),row:ii+4,name,stage,group,start:match?date(`2026-${match[1]}-${match[2]}`):'',end:match?date(`2026-${match[3]}-${match[4]}`):'',duration,status:status(r[2]),rawStatus:r[2]||'未填',sheet:'项目计划'})});return{plans,tasks:[],aux:[],modules:[],stages:src.stages}}

function go(v){view=v;page=1;render();window.scrollTo({top:0,behavior:'smooth'})}function drill(s,filter=''){selectedStage=s;planScope='stage';planGroup='';moduleFilter='';statusFilter=filter;query='';detailMode='plan';go('detail')}
function header(title,sub,eyebrow='PROJECT OVERVIEW'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<div class="subtitle">${sub}</div>`:''}</div><div class="head-actions"><button class="btn" data-action="export">${icon('download')}导出汇报版</button><button class="btn primary" data-action="upload">${icon('upload')}更新本周数据</button></div></div>`}
function render(){ currentDay=beijingToday();$('#crumb').textContent={overview:'项目总览',detail:'阶段计划',updates:'每周数据更新'}[view];$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));$('#main').innerHTML=({overview:overview,detail:details,updates:updates}[view])();icons();bind();const complete=model.stages.filter(s=>s.status==='已完成').length;$('.project-health strong').textContent=model.stages.filter(s=>s.status==='进行中').map(s=>s.name.replace('阶段','')).join('与')||'查看各阶段状态';$('.project-health small').textContent=`${complete} / 5 个阶段已完成`;$('.mini-phases').innerHTML=model.stages.map(s=>s.status==='已完成'?'<b></b>':'<i></i>').join('');}
function overview(){const done=model.stages.filter(s=>s.status==='已完成').length,active=model.stages.filter(s=>s.status==='进行中').length,rows=planRows(),leaves=rows.filter(p=>p.leaf),running=leaves.filter(p=>p.status==='进行中'),next=model.stages.filter(s=>s.status!=='已完成'&&s.end>=source.asOf).sort((a,b)=>a.end.localeCompare(b.end))[0];return header('彩棠工作台项目管理',`计划周期 ${model.stages[0].start.replaceAll('-','.')} — ${model.stages[4].end.replaceAll('-','.')}`)+`<section class="metrics"><div class="metric"><div class="metric-top">阶段完成率 ${icon('layers')}</div><div class="metric-value">${done*20}<small>%</small></div><div class="metric-foot"><em>${done} 个阶段已完成</em>共 5 个阶段</div><div class="donut" style="background:conic-gradient(var(--blue) ${done*20}%,#edf1fa 0)"></div></div><div class="metric"><div class="metric-top">当前进行阶段 ${icon('clock')}</div><div class="metric-value">${String(active).padStart(2,'0')}<small>个</small></div><div class="metric-foot">${model.stages.filter(s=>s.status==='进行中').map(s=>s.name.replace('阶段','')).join(' · ')||'暂无进行中的阶段'}</div></div><div class="metric"><div class="metric-top">下一阶段里程碑 ${icon('flag')}</div><div class="metric-value">${next?md(next.end):'—'}<small>${next?'2026':''}</small></div><div class="metric-foot">${next?next.name+'计划结束':'暂无待完成里程碑'}</div></div><button class="metric" style="text-align:left" data-action="allPlans"><div class="metric-top">细分计划项 ${icon('gantt')}</div><div class="metric-value">${leaves.length}<small>项</small></div><div class="metric-foot"><em>${leaves.filter(p=>p.status==='已完成').length} 项已完成</em>来源：项目计划</div></button></section><div class="overview-grid"><section class="panel"><div class="panel-head"><div><h2>项目阶段甘特图 <small>PROJECT ROADMAP</small></h2><p>计划与实际同步呈现 · 点击阶段查看细分计划</p></div><div class="segments"><button data-gran="month" class="${granularity==='month'?'selected':''}">月视图</button><button data-gran="week" class="${granularity==='week'?'selected':''}">周视图</button></div></div><div class="legend"><span><i></i>已完成</span><span><i class="blue"></i>实际已开展</span><span><i class="gray"></i>计划区间</span><span class="hint">实际结束时间以总管理表为准</span></div>${gantt()}</section></div><div class="lower-grid"><section class="panel"><div class="panel-head"><h2>关键里程碑 <small>MILESTONES</small></h2>${icon('flag')}</div><div class="milestone-list">${[{date:model.stages[3].end,name:'详细设计阶段完成',desc:'战略 · 总阶段计划',stage:3},{date:model.plans.find(p=>p.name.includes('实施开发开发计划'))?.end||'2026-12-02',name:'已知需求实施开发完成',desc:'项目计划 · 实施开发计划',stage:4},{date:model.stages[4].end,name:'实施落地阶段完成',desc:'数科 · 总阶段计划',stage:4}].map(m=>`<button class="milestone-item" style="width:100%;text-align:left" data-stage="${m.stage}"><div class="date-tile"><small>${m.date.slice(5,7)}月</small>${m.date.slice(8)}</div><div><strong>${m.name}</strong><p>${m.desc}</p></div><span class="badge active">计划节点</span></button>`).join('')}</div></section><section class="panel blockers-panel"><div class="panel-head"><h2>当前项目卡点 <small>PROJECT BLOCKERS</small></h2></div><div class="blockers-empty"><span class="blockers-icon">${icon('check')}</span><strong>暂无卡点</strong></div></section></div>`}
function gantt(){
 const DAY=86400000,weekly=granularity==='week',base=new Date(currentDay+'T00:00:00Z'),dow=(base.getUTCDay()+6)%7;
 const start=weekly?stamp(currentDay)-(dow+14)*DAY+weekOffset*42*DAY:stamp('2026-08-01');
 const end=weekly?start+42*DAY:Math.max(stamp('2026-12-15'),...model.stages.map(s=>stamp(s.end)+7*DAY));
 const iso=n=>new Date(n).toISOString().slice(0,10),pos=d=>Math.max(0,Math.min(100,(stamp(d)-start)/(end-start)*100));
 const marks=weekly?Array.from({length:6},(_,i)=>iso(start+i*7*DAY)):['2026-08-01','2026-09-01','2026-10-01','2026-11-01','2026-12-01'];
 const today=pos(currentDay),insideToday=stamp(currentDay)>=start&&stamp(currentDay)<end;
 const grid=marks.slice(1).map(d=>`<span class="grid-line" style="left:${pos(d)}%"></span>`).join('');
 const controls='';
 return controls+`<div class="gantt-scroll"><div class="gantt ${weekly?'weekly-gantt':''}"><div class="gantt-head"><div>阶段状态 / 项目阶段 / 主责部门</div><div class="months">${marks.map((d,i)=>`<span style="left:${pos(d)}%">${weekly?`<b>第 ${i+1} 周</b><small>${md(d)} — ${md(iso(stamp(d)+6*DAY))}</small>`:d.slice(5,7)+'月'}</span>`).join('')}</div></div><div class="gantt-body">${model.stages.map((s,i)=>{
 const inRange=stamp(s.end)>=start&&stamp(s.start)<end,left=pos(s.start),width=Math.max(pos(iso(stamp(s.end)+DAY))-left,.6),actualEnd=s.actualEnd||((s.actualStart&&source.asOf>=s.actualStart)?source.asOf:''),actualVisible=actualEnd&&stamp(actualEnd)>=start&&stamp(s.actualStart)<end,actualLeft=s.actualStart?pos(s.actualStart):0,actualWidth=actualVisible?Math.max(.6,pos(iso(stamp(actualEnd)+DAY))-actualLeft):0,clr=s.status==='已完成'?'#30b6a4':i===3?'#7180e3':'#4662dd',outside=width<20,label=s.start===s.end?md(s.start):`${md(s.start)} — ${md(s.end)}`;
 return `<div class="gantt-row" data-stage="${i}" role="button" tabindex="0" aria-label="查看${s.name}"><div class="stage-label"><span class="stage-state ${cls(s.status)}">${s.status==='已完成'?icon('check'):icon('clock')}${esc(s.status)}</span><div><strong>${s.name}</strong><small>${esc(s.owner)} · 主责部门</small></div></div><div class="track">${grid}${inRange?`<div class="plan-line" style="left:${left}%;width:${width}%;background:${i===3?'#e9e7fa':i===4?'#dfe7fc':'#e0f3ef'}"></div>${actualVisible?`<div class="actual-line" style="left:${actualLeft}%;width:${actualWidth}%;background:${clr}"></div>`:''}${s.start===s.end?`<span class="milestone-diamond" style="left:${left}%"></span>`:''}<span class="bar-label ${outside?'outside':''}" style="left:${outside?Math.min(left+width+1,80):left+1.5}%;${!actualVisible?'color:#7686a6!important;text-shadow:none':''}">${label}${i>2?' · '+s.status:''}</span>`:`<span class="out-of-range">${stamp(s.end)<start?(s.status==='已完成'?'已于 '+md(s.actualEnd||s.end)+' 完成':'计划于 '+md(s.end)+' 结束'):'计划 '+md(s.start)+' 开始'}<small>不在当前 6 周窗口</small></span>`}${insideToday?`<span class="today-line" style="left:${today}%">${i===0?'<span title="北京时间">今天 '+md(currentDay)+'</span>':''}</span>`:''}</div></div>`}).join('')}</div></div></div>`
}

function planLabel(name){return /^需求评审彩棠/.test(name)?'需求评审':/^实施开发开发计划/.test(name)?'实施开发':name;}
function planRows(){let parent='',groupLabel='';return model.plans.map(p=>{const groupHeader=/^需求评审彩棠|^实施开发开发计划|^功能测试$/.test(p.name);if(groupHeader){parent=p.id;groupLabel=p.name}if(p.name==='UAT'||p.name==='上线试运行'){parent='';groupLabel=''}return {...p,groupHeader,parent:groupHeader?'':parent,groupLabel,leaf:!groupHeader}})}
function visiblePlans(){const all=planRows(),filtered=all.filter(p=>(planScope==='all'||p.stage===selectedStage)&&(!query||(p.name+p.duration+p.rawStatus+p.groupLabel).toLowerCase().includes(query.toLowerCase()))&&(!statusFilter||(!p.groupHeader&&p.status===statusFilter))&&(!planGroup||p.groupLabel===planGroup));const parents=new Set(filtered.map(p=>p.parent).filter(Boolean));return all.filter(p=>filtered.some(f=>f.id===p.id)||parents.has(p.id))}
function showAllPlans(){planScope='all';query='';statusFilter='';planGroup='';detailMode='plan';go('detail')}
function details(){const all=planRows(),scope=all.filter(p=>planScope==='all'||p.stage===selectedStage),leaves=scope.filter(p=>p.leaf),completed=leaves.filter(p=>p.status==='已完成').length,running=leaves.filter(p=>p.status==='进行中').length;return header('细分阶段计划',``,'DETAILED PROJECT PLAN')+`<div class="plan-scope"><button class="btn ${planScope==='all'?'primary':''}" data-all-plans>全部计划</button><span>按总管理阶段查看</span>${model.stages.map((s,i)=>`<button class="scope-tab ${planScope!=='all'&&selectedStage===i?'selected':''}" data-stage="${i}">${s.name}</button>`).join('')}</div><section class="panel"><div class="detail-summary"><div><h2>${planScope==='all'?'项目工作计划':model.stages[selectedStage].name}</h2><p>${planScope==='all'?'架构与调研 → 功能设计 → 需求评审 → 实施开发 → 功能测试':'阶段筛选 · 原表内容和次序保持不变'}</p></div><div class="detail-counts"><div><strong>${leaves.length}</strong><small>细分计划项</small></div><div><strong style="color:#28a891">${completed}</strong><small>原表已完成</small></div><div><strong style="color:#6579d5">${running}</strong><small>原表进行中</small></div></div></div><div class="filter-bar"><label class="search-field">${icon('search')}<input id="planSearch" placeholder="搜索项目阶段或模块" value="${esc(query)}" aria-label="搜索细分计划"></label><select id="planGroup" aria-label="按原表分组筛选"><option value="">全部分组</option>${all.filter(p=>p.groupHeader).map(p=>`<option value="${esc(p.name)}" ${p.name===planGroup?'selected':''}>${esc(p.name.replace('需求评审彩棠工作台功能说明书（数科）','需求评审').replace('实施开发开发计划（已知需求）','实施开发'))}</option>`).join('')}</select><select id="planStatus" aria-label="按原表状态筛选"><option value="">全部状态</option>${['已完成','进行中','待启动','待确认'].map(st=>`<option value="${st}" ${statusFilter===st?'selected':''}>${st==='待确认'?'状态未填':st}</option>`).join('')}</select><div class="segments"><button data-plan-mode="plan" class="${detailMode==='plan'?'selected':''}">原表计划</button><button data-plan-mode="plan-gantt" class="${detailMode==='plan-gantt'?'selected':''}">计划甘特</button></div></div><div id="planResults">${planResults()}</div></section><div class="mini-note">当前 ${model.plans.length} 条原表记录，${all.filter(p=>p.groupHeader).length} 条为分组标题、${all.filter(p=>p.leaf).length} 条为细分计划项。状态沿用原表，“已完成评审”“已完成开发”“待启动（预估）”分别保留；UAT 与上线试运行的日期、状态原表未填。</div>`}
function planResults(){const rows=visiblePlans();if(!rows.length){if(planScope!=='all'&&selectedStage===0)return '<div class="empty">启动阶段已于 08.03 完成</div>';return '<div class="empty">没有符合条件的计划项<br><button class="text-btn" data-reset-plan>清除筛选</button></div>'}let collapsed=0;const visible=rows.filter(p=>{if(p.parent&&collapsedPlanGroups.has(p.parent)){collapsed++;return false}return true});if(detailMode==='plan-gantt')return planGantt(visible)+`<div class="table-footer">${rows.filter(p=>p.leaf).length} 个计划项 · W1–W16 对应原表 09.14 — 次年 01.03 · 向右滚动查看完整排期</div>`;return `<div class="task-table-wrap"><table class="task-table original-plan-table"><thead><tr><th>项目阶段 / 计划项</th><th>用时</th><th>计划周期</th><th>状态</th><th></th></tr></thead><tbody>${visible.map(p=>p.groupHeader?`<tr class="plan-group-row" data-plan-group-toggle="${p.id}"><td><button class="plan-group-btn" aria-expanded="${!collapsedPlanGroups.has(p.id)}"><span class="group-toggle">${collapsedPlanGroups.has(p.id)?'+':'−'}</span>${esc(planLabel(p.name))}</button></td><td>${esc(p.duration)}</td><td>${md(p.start)} — ${md(p.end)}</td><td><span class="workflow-label">${esc(p.rawStatus)}</span></td><td><span class="group-count">${planRows().filter(x=>x.parent===p.id).length} 项</span></td></tr>`:`<tr data-plan="${p.id}"><td><div class="original-plan-title ${p.parent?'child-plan':''}">${p.parent?'<span class="child-dot"></span>':'<span class="source-row">'+String(p.row-3).padStart(2,'0')+'</span>'}<strong>${esc(planLabel(p.name))}</strong></div></td><td class="plan-duration">${esc(p.duration.split('（')[0]||'未填')}</td><td class="plan-period">${p.start?md(p.start)+' — '+md(p.end):'未填'}</td><td><span class="badge ${cls(p.status)}">${esc(p.rawStatus==='未填'?'未填':p.rawStatus)}</span></td><td class="plan-chevron">${icon('chevron')}</td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${rows.filter(p=>p.leaf).length} 个计划项 ${collapsed?'· '+collapsed+' 项已折叠':''} · 按原表顺序展示</span><span>来源：项目计划</span></div>`}
function planGantt(rows){const start=stamp('2026-09-14'),end=start+112*86400000,pct=d=>Math.max(0,Math.min(100,(stamp(d)-start)/(end-start)*100));return `<div class="task-table-wrap"><div class="original-gantt"><div class="og-header"><div class="og-frozen"><b>项目阶段 / 计划项</b><span>状态</span></div><div class="og-weeks">${Array.from({length:16},(_,i)=>{let d=new Date(start+i*7*86400000).toISOString().slice(0,10);return `<div><b>W${i+1}</b><small>${md(d)}</small></div>`}).join('')}</div></div>${rows.map(p=>{const out=p.end&&stamp(p.end)<start,left=p.start?pct(p.start):0,width=p.end?Math.max(.6,pct(new Date(stamp(p.end)+86400000).toISOString().slice(0,10))-left):0;return `<div class="og-row ${p.groupHeader?'og-group':''}" ${p.groupHeader?`data-plan-group-toggle="${p.id}"`:`data-plan="${p.id}"`}><div class="og-frozen"><span class="og-name ${p.parent?'og-child':''}">${p.groupHeader?'<b>'+ (collapsedPlanGroups.has(p.id)?'+':'−') +' '+esc(planLabel(p.name))+'</b>':esc(planLabel(p.name))}</span>${p.groupHeader?'':`<span class="badge ${cls(p.status)}">${esc(p.rawStatus)}</span>`}</div><div class="og-track">${out?`<span class="og-out">${md(p.start)} — ${md(p.end)} · ${esc(p.rawStatus)}</span>`:p.start?`<span class="og-bar ${cls(p.status)}" style="left:${left}%;width:${width}%">${p.groupHeader?'':md(p.start)+' — '+md(p.end)}</span>`:'<span class="og-out">原表日期未填</span>'}</div></div>`}).join('')}</div></div>`}

let historyDatabase = null, historyLoaded = false, historyError = '', latestRecordId = '', savingImport = false;
let historyReady;
function cleanSnapshot(value) {
  const copy = structuredClone(value);
  delete copy.history;
  copy.sheets = copy.sheets.filter(sheet => sheet.sheet === '项目计划');
  return copy;
}
function openHistoryDatabase() {
  return new Promise((resolve, reject) => {
    const scope = location.protocol === 'file:' ? location.pathname : location.pathname.replace(/[^/]*$/, '');
    const request = indexedDB.open('caitang-project-history-v1:' + scope, 1);
    request.onupgradeneeded = () => {
      for (const name of ['records', 'files', 'state']) {
        request.result.createObjectStore(name, { keyPath: name === 'state' ? 'key' : 'id' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('请关闭其他看板窗口后重试'));
  });
}
async function initializeHistory() {
  try {
    historyDatabase = await openHistoryDatabase();
    const saved = await new Promise((resolve, reject) => {
      const tx = historyDatabase.transaction(['records', 'state'], 'readonly');
      const records = tx.objectStore('records').getAll();
      const current = tx.objectStore('state').get('latest');
      tx.oncomplete = () => resolve({ records: records.result, current: current.result });
      tx.onabort = () => reject(tx.error || new Error('历史记录读取失败'));
    });
    updateHistory = saved.records.sort((a, b) => b.createdAt - a.createdAt || b.id.localeCompare(a.id));
    if (saved.current) {
      const restored = cleanSnapshot(saved.current.snapshot);
      validateStages(restored.stages);
      model = parseModel(restored);
      source = restored;
      latestRecordId = saved.current.recordId;
    }
  } catch (error) {
    historyError = '无法读取浏览器保存的记录，请检查浏览器存储权限后刷新。';
  } finally {
    historyLoaded = true;
    render();
  }
}
function storeImport(record, file) {
  if (!historyDatabase || historyError) return Promise.reject(new Error('浏览器存储不可用，请允许网站保存数据后重试'));
  return new Promise((resolve, reject) => {
    let tx;
    try {
      tx = historyDatabase.transaction(['records', 'files', 'state'], 'readwrite');
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error || new Error('保存中断'));
      tx.objectStore('records').add(record);
      tx.objectStore('files').add({ id: record.id, blob: file.slice(0, file.size, file.type) });
      tx.objectStore('state').put({ key: 'latest', recordId: record.id, snapshot: record.snapshot });
    } catch (error) {
      if (tx) { try { tx.abort(); } catch {} }
      reject(error);
    }
  });
}
function historyRows() {
  if (!historyLoaded) return '<div class="mini-note" data-history-loading>正在读取更新记录…</div>';
  const records = updateHistory.map(record => `<div class="summary-item history-record" data-record-id="${esc(record.id)}">${icon('file')}<div class="history-info"><strong>${esc(record.name)}</strong><p>${esc(record.time)} · ${record.changes} 项差异 · 报告基准 ${esc(record.asOf)}</p></div><span class="badge ${record.id === latestRecordId ? 'done' : 'pending'}">${record.id === latestRecordId ? '当前版本' : '已归档'}</span><div class="history-actions"><button class="btn" data-history-download="${esc(record.id)}">${icon('download')}下载原文件</button></div></div>`).join('');
  return records + `<div class="summary-item history-initial">${icon('file')}<div class="history-info"><strong>${esc(window.ORIGINAL_EXCEL?.name || '初始项目工作计划.xlsx')}</strong><p>初始上传文件 · Excel 原件</p></div><span class="badge pending">初始文件</span><div class="history-actions"><button class="btn" data-history-download="initial">${icon('download')}下载原文件</button></div></div>`;
}

async function downloadHistory(id) {
  try {
    if (id === 'initial') {
      const original = window.ORIGINAL_EXCEL;
      if (!original?.base64) throw new Error('Excel 原件尚未载入，请刷新后重试');
      const bytes = Uint8Array.from(atob(original.base64), char => char.charCodeAt(0));
      return download(bytes, original.name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    }
    const record = updateHistory.find(item => item.id === id);
    if (!record) throw new Error('未找到这条更新记录');
    const saved = await new Promise((resolve, reject) => {
      const request = historyDatabase.transaction('files', 'readonly').objectStore('files').get(id);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    if (!saved?.blob) throw new Error('原文件记录不可用');
    download(saved.blob, record.name, saved.blob.type || 'application/octet-stream');
  } catch (error) { toast('下载失败：' + error.message); }
}

  $$('[data-history-download]').forEach(button => button.onclick = () => downloadHistory(button.dataset.historyDownload));

async function applyImport() {
  if (!pendingImport || savingImport) return;
  const asOf = $('#importAsOf').value;
  if (!date(asOf)) return toast('请填写有效的报告基准日期');
  savingImport = true;
  const button = $('#applyImport');
  const controls = [...document.querySelectorAll('#uploadContent button, #uploadContent input')];
  controls.forEach(control => control.disabled = true);
  button.textContent = '正在保存记录…';
  $('#historySaveError')?.remove();
  try {
    await historyReady;
    const snapshot = cleanSnapshot(pendingImport.source);
    snapshot.asOf = asOf;
    const record = {
      id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`,
      name: pendingImport.name,
      createdAt: Date.now(), time: new Date().toLocaleString('zh-CN'),
      changes: pendingImport.changes.length, asOf, snapshot
    };
    await storeImport(record, pendingImport.file);
    source = snapshot;
    model = parseModel(source);
    updateHistory.unshift(record);
    latestRecordId = record.id;
    pendingImport = null;
    $('#uploadDialog').close();
    render();
    toast('看板已更新，原文件和历史记录已保存');
  } catch (error) {
    const message = document.createElement('div');
    message.id = 'historySaveError';
    message.className = 'error-box';
    message.setAttribute('role', 'alert');
    message.textContent = (error.name === 'QuotaExceededError' ? '浏览器存储空间不足，请释放空间后重试。' : '记录保存失败，请检查浏览器存储权限后重试。') + '当前看板未更新，原有记录未改变。';
    $('#uploadContent .dialog-body').appendChild(message);
  } finally {
    savingImport = false;
    controls.forEach(control => control.disabled = false);
    button.textContent = '确认更新看板';
  }
}

async function exportHTML() {

    if (!css || !js || !html) {
      [css, js, html] = await Promise.all(['style.css', 'app.js', 'index.html'].map(url =>

      .replace(/<script src="app\.js(?:\?[^\"]*)?"><\/script>/, () => '<script>' + js.replaceAll('<\/script', '<\\/script') + '<\/script>');

function taskKey(t){return [t.sheet,t.module||t.group||'',t.root||'',t.level||'',t.name].join('|')}
function compare(before,after){let oldItems=before.plans,newItems=after.plans,old=new Map(oldItems.map(t=>[taskKey(t),t])),changes=[];for(const t of newItems){let p=old.get(taskKey(t));if(!p)changes.push({type:'新增',name:t.name});else{let keys=['status','start','end','actualStart','actualEnd','owner','note','output','rawStatus'];let changed=keys.filter(k=>(p[k]||'')!==(t[k]||''));if(changed.length)changes.push({type:'变更',name:t.name,desc:changed.map(k=>({status:'状态',start:'计划开始',end:'计划结束',actualStart:'实际开始',actualEnd:'实际结束',owner:'负责人',note:'备注',output:'产出物',rawStatus:'原始状态'}[k])).join('、')});old.delete(taskKey(t))}}for(const t of old.values())changes.push({type:'移除',name:t.name});after.stages.forEach((s,i)=>{if(JSON.stringify(s)!==JSON.stringify(before.stages[i]))changes.push({type:'阶段更新',name:s.name})});return changes}
async function importFile(file){await historyReady;$('#fileInput').value='';pendingImport=null;$('#uploadContent').innerHTML='<div class="dialog-body"><h2>正在读取本周数据</h2><p>文件只在当前页面解析，请稍候…</p></div>';$('#uploadDialog').showModal();try{if(file.size>10*1024*1024)throw Error('文件超过 10 MB，请精简后上传');let next=structuredClone(source),extension=file.name.split('.').pop().toLowerCase();if(extension==='xlsx'){const sheets=await readXlsx(await file.arrayBuffer());for(const s of sheets){let idx=next.sheets.findIndex(t=>t.sheet===s.sheet);if(idx<0)next.sheets.push(s);else next.sheets[idx]=s}}else if(extension==='csv'){const rows=parseCsv((await file.text()).replace(/^\ufeff/,'')),expected=['项目阶段','主责部门','计划开始时间','计划结束时间','实际开始时间','实际结束时间','阶段状态'];if(expected.some((h,i)=>rows[0]?.[i]?.trim()!==h))throw Error('CSV 表头不匹配，请按总阶段更新表的列顺序填写');next.stages=rows.slice(1).map(r=>({name:r[0]?.trim(),owner:r[1]?.trim(),start:date(r[2]),end:date(r[3]),actualStart:date(r[4]),actualEnd:date(r[5]),status:r[6]?.trim()}))}else if(extension==='json'){next=JSON.parse(await file.text());if(!Array.isArray(next.sheets)||next.sheets.some(s=>!Array.isArray(s.data)))throw Error('JSON 不是有效的看板数据快照')}else throw Error('请上传 .xlsx、.csv 或 .json 文件');next.sheets=next.sheets.filter(s=>s.sheet==='项目计划');if(!next.sheets.length)throw Error('快照中缺少「项目计划」工作表');validateStages(next.stages);next.stages=next.stages.map(s=>({...s,start:date(s.start),end:date(s.end),actualStart:date(s.actualStart),actualEnd:date(s.actualEnd)}));let nm=parseModel(next),changes=compare(model,nm);pendingImport={source:next,model:nm,changes,name:file.name,file};$('#uploadContent').innerHTML=`<div class="drawer-header"><span>更新预览 / ${esc(file.name)}</span><button class="icon-btn" data-close="uploadDialog" aria-label="关闭更新预览">${icon('close')}</button></div><div class="dialog-body"><h2>本周数据已准备就绪</h2><p>确认变更后更新当前看板。Excel 只读取「项目计划」一张表，总阶段名称与顺序保持固定。</p><div class="preview-stats"><div><b>${nm.plans.length}</b><small>主表计划记录</small></div><div><b>${nm.stages.length}</b><small>总管理阶段</small></div><div><b>${changes.length}</b><small>检测到的差异</small></div></div><label style="font-size:12px;color:#7b89a7">报告基准日期 <input class="date-input" id="importAsOf" type="date" value="${esc(date(next.asOf)||source.asOf)}"></label><p>报告基准记录本次数据的截止日期；甘特图的今天标线按北京时间自动更新。</p><div class="diff-list">${changes.length?changes.slice(0,100).map(c=>`<div class="diff-row"><span class="badge ${c.type==='移除'?'late':'active'}">${c.type}</span> ${esc(c.name)}${c.desc?'<small style="color:#9aa6bd"> · '+esc(c.desc)+'</small>':''}</div>`).join(''):'<div class="diff-row">与当前数据一致，未发现任务字段变化。</div>'}</div>${changes.length>100?'<p>仅展示前 100 项差异，应用时包含全部变更。</p>':''}</div><div class="dialog-actions"><button class="btn" data-close="uploadDialog">取消</button><button class="btn primary" id="applyImport">确认更新看板</button></div>`;$$('[data-close="uploadDialog"]').forEach(b=>b.onclick=()=>$('#uploadDialog').close());$('#applyImport').onclick=applyImport}catch(e){$('#uploadContent').innerHTML=`<div class="dialog-body"><h2>暂时无法导入</h2><div class="error-box">${esc(e.message)}</div><p>当前看板数据未发生改变。</p></div><div class="dialog-actions"><button class="btn" id="closeImportError">关闭</button><button class="btn primary" id="retryImport">重新选择文件</button></div>`;$('#closeImportError').onclick=()=>$('#uploadDialog').close();$('#retryImport').onclick=()=>{$('#uploadDialog').close();$('#fileInput').click()}}}
$$('.nav').forEach(b=>b.onclick=()=>b.dataset.view==='detail'?showAllPlans():go(b.dataset.view));$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('当前窗口不支持全屏，可在浏览器中按 F11')}};$('#fileInput').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0])};$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){if(savingImport)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));render();historyReady=initializeHistory();
scheduleDayRefresh();
window.addEventListener('focus', refreshCurrentDay);
window.addEventListener('pageshow', refreshCurrentDay);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCurrentDay(); });
$('#uploadDialog').addEventListener('cancel',e=>{if(savingImport)e.preventDefault()});
if(document.modelContext?.registerTool){const life=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'read_project_snapshot',title:'读取项目快照',description:'读取当前彩棠看板的五个总阶段和项目计划记录数，不修改数据。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('不接受参数');return {asOf:source.asOf,stages:model.stages,planRecords:model.plans.length,planItems:planRows().filter(p=>p.leaf).length,sourceSheet:'项目计划'}}},{signal:life.signal})).catch(()=>{});window.addEventListener('pagehide',()=>life.abort(),{once:true})}catch{}}
</script></body></html>
